  GATT/CL/GAR/BV-10-C:
    verdict: pass
    last_run: '2026-10-31'
    notes: 'Read Multiple Variable Length over ATT+EATT bearers (GATT.TS 4.6.1). Three
      fixes: (1) EATT_CONNECT 0x1f now also registers a GATT-client ATT bearer per
      EATT channel (server attach alone left it server-only); (2) the service fires
      both RMVL requests on the first BTP 0x20 and collects the EATT future on the
      second, because BTP dispatch is serial while the MSC needs both requests on
      air before LT answers; (3) hdl_wid_147 override drives both commands and stores
      the WID-55 verify value (upstream never stores one, so WID 55 always answered
      No). ATT mux routes the EATT response by opcode. PTS PASS 2026-10-29 WID 2/142/402/147/55/3.'
    bug_refs: []
