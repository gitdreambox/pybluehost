      were sent with PB 0b11 (auto-flushable) and the Intel BE200 silently discards
      every one after the first fragment (on-air 251 of 516 bytes; controller still
      reports them completed). send_acl_data now uses PB 0b01, verified by a two-BE200
      probe and by this case PASSing on attempt 1.'
