  GAP/CONN/DCON/BV-04-C:
    verdict: blocked
    last_run: '2026-10-31'
    notes: 'PTS-limited: TS p188-189 wants Directed Connectable mode (AdvA=RPA(IUT
      IRK), InitA=RPA(LT IRK)) but this PTS build only sends WID 118 (CAR read) +
      WID 20001 twice (''prepare IUT into a connectable mode''); WID 406/407 (directed
      order) never arrive, so no IUT driven by auto-pts can enter directed mode. Phase-1
      LT scan is accept-list-only (0x2041 filter=0x01, list=our identity) with no
      resolving-list add and no LE_Set_Address_Resolution_Enable, so our RPA advertisement
      is dropped and the case dies in PTS TIMEOUT. Causal proof (2026-10-31): same
      code advertising from the public identity made the LT log the report (HciLogs
      SIG_DT t=1337) and connect via LE_Extended_Create_Connection 0x2043 (Enhanced
      Connection Complete status=0x00). No reference IUT (zephyr/bluez/mynewt) registers
      DCON/BV-04/05.'
    bug_refs: []
