      literals.'
    bug_refs: []
  GAP/BIS/BBM/BV-01-C:
    verdict: blocked
    last_run: '2026-10-29'
    notes: 'controller-blocked on BOTH seats (re-probed 2026-10-29 on the new BE200
      IUT A0:85, fw hci_rev/lmp_subver 0x5544): LE_Create_BIG (0x2068) answers Command
      Status 0x01 Unknown Command with AND without an enabled extended adv set (4
      runs), periodic family 0x203E/0x203F/0x2040 all 0x01, LE features ffd9013cee000000
      lack bit 30 ISO_Broadcaster. Sharper picture than the AX201 probe: CIS family
      IS known (0x2062/0x2064 answer 0x12 Invalid Parameters = parsed), so this firmware
      has connected-ISO but NO broadcast-ISO and NO periodic advertising - BIG broadcast
      is absent at the firmware cut, not state-gated. The AX201-era ''unlock = BE200
      as IUT'' path is dead: that BIG-capable BE200 (94:53, fw 0x5500) is retired;
      both dongles in the current rig are the 10-27 batch. Implementation kept ready
      (IsoBroadcastManager + BTP 0x2d/0x2e + ev 0x95, unit-tested); runs on any BIG-capable
      controller. BIS/BSE/BV-01 blocked the same way (see its note).'
    bug_refs: []
  GAP/BIS/BSE/BV-01-C:
    verdict: blocked
    last_run: '2026-10-29'
    notes: 'Controller-blocked on the new BE200 IUT too (re-probed 2026-10-29): BIG_Create_Sync
      (0x206B) is unreachable transitively - the periodic-advertising family it syncs
      through (0x203E/0x203F/0x2040) answers 0x01 Unknown Command on this firmware
      cut (hci_rev/lmp_subver 0x5544), and LE features ffd9013cee000000 lack ISO_Broadcaster
      (bit 30) while the CIS family (0x2062/0x2064) answers 0x12 = known. Connected-ISO
      yes, broadcast-ISO no - same firmware-absence verdict as BBM/BV-01, no dongle
      in the current rig can unlock it.'
    bug_refs: []
