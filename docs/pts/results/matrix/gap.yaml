    last_run: '2026-10-31'
    notes: 'LT-side blocker, not an IUT defect. WIDs stop at 78/208/1002: the SC passkey
      pairing completes (Encryption_Change 0x00, IRK+CSRK distributed, ltk_stored=YES)
      and then the LT sends SMP Pairing Failed 0x08 and disconnects; it never advertises,
      so the observer/scan half of the case never runs. Reproduced 2/2 on 2026-10-31
      (plus 3/3 on 2026-10-29) with a byte-identical signature; same LT behaviour
      class as GAP/SEC/AUT/BV-27 and SM/PER/KDU.'
