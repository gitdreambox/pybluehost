  L2CAP/COS/CED/BI-29-C:
    verdict: blocked
    last_run: '2026-10-29'
    notes: "LT-structural, IUT exonerated: PTS LT LE DCID allocator holds exactly\
      \ 64 values (0x0040-0x007F, wraps 0x7F->0x40) and stops responding + aborts\
      \ the ACL the moment the cycle completes (last response dcid=0x0053, round ~65\
      \ of 255). Proven across 4 hardware runs: 1.2s/round window (abort at 65 rounds/80s),\
      \ 0.22s/round window (abort at 66 rounds/21s \u2014 pacing-independent), and\
      \ with SCID 0x0080 skipped so round 65 used 0x0081 (identical terminal dcid=0x0053\
      \ \u2014 SCID/PSM-collision hypothesis disproved). IUT side exhaustively verified:\
      \ per-round fresh identifiers, no retransmission, wrong-id SUCCESS ignored,\
      \ refusals reported, 65+ rounds clean. Case needs 255 rounds on one ACL; LT\
      \ cannot issue past 64 DCIDs."
    bug_refs: []
