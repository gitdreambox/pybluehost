name: PTS BTP virtual self-check

on:
  push:
    branches: [master, "v1.2-*"]
  pull_request:
    branches: [master]

jobs:
  btp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: pip install uv
      - name: Install project
        run: uv sync --extra dev
      - name: Run BTP smoke (spawn pts-tester + walk Core/GAP/GATT sequence)
        run: uv run python scripts/ci_btp_smoke.py
      - name: Run PTS + BTP unit tests
        run: uv run pytest tests/unit/pts/ tests/unit/auto_pts_project/ tests/integration/test_btp_e2e_*.py -v
